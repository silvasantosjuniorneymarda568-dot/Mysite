<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Site</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

h1{
    color:#fff;
    font-size:58px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    z-index:10;
    animation:pulse 1.5s infinite;
}

.snow{
    position:fixed;
    top:-50px;
    color:#eef8ff;
    font-size:18px;
    pointer-events:none;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes pulse{
    0%{opacity:.5;}
    50%{opacity:1;}
    100%{opacity:.5;}
}

@keyframes fall{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(calc(100vh + 60px));
    }
}
</style>

</head>

<body>

<h1>click to enter...</h1>

<script>

for(let i=0;i<30;i++){

    let snow=document.createElement("div");

    snow.className="snow";

    snow.innerHTML="❄";

    snow.style.left=Math.random()*100+"vw";

    snow.style.animationDuration=(5+Math.random()*5)+"s";

    snow.style.animationDelay=(-Math.random()*10)+"s";

    snow.style.fontSize=(14+Math.random()*16)+"px";

    document.body.appendChild(snow);

}

</script>

</body>
</html>
