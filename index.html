<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Site</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

h1{
    color:white;
    font-size:48px;
    animation:pulse 1.5s infinite;
    z-index:10;
    cursor:pointer;
    user-select:none;
}

.snow{
    position:fixed;
    top:-30px;
    color:#eaf8ff;
    text-shadow:0 0 8px #ffffff;
    font-size:18px;
    pointer-events:none;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes pulse{
    0%{opacity:.5;}
    50%{opacity:1;}
    100%{opacity:.5;}
}

@keyframes fall{
    from{
        transform:translateY(-50px);
    }
    to{
        transform:translateY(calc(100vh + 50px));
    }
}
</style>

</head>

<body>

<h1>click to enter...</h1>

<script>
for(let i=0;i<35;i++){

    let snow=document.createElement("div");
    snow.className="snow";
    snow.innerHTML="❄";

    snow.style.left=Math.random()*100+"vw";
    snow.style.animationDuration=(5+Math.random()*6)+"s";
    snow.style.animationDelay=(-(Math.random()*11))+"s";
    snow.style.fontSize=(14+Math.random()*16)+"px";

    document.body.appendChild(snow);
}
</script>

</body>
</html>
