<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Site</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

h1{
    position:relative;
    z-index:10;
    color:#ffffff;
    font-size:11vw;
    font-weight:700;
    white-space:nowrap;
    animation:pulse 1.5s ease-in-out infinite;
    cursor:pointer;
    user-select:none;
}

.snow{
    position:fixed;
    top:-60px;
    color:#eef8ff;
    font-size:18px;
    pointer-events:none;
    user-select:none;
    animation:fall linear infinite;
}

@keyframes pulse{
    0%{opacity:.55;}
    50%{opacity:1;}
    100%{opacity:.55;}
}

@keyframes fall{
    from{
        transform:translateY(-60px);
    }
    to{
        transform:translateY(calc(100vh + 80px));
    }
}
</style>
</head>

<body>

<h1>click to enter...</h1>

<script>

for(let i=0;i<30;i++){

    const snow=document.createElement("div");

    snow.className="snow";

    snow.innerHTML="❄";

    snow.style.left=Math.random()*100+"vw";

    snow.style.fontSize=(12+Math.random()*16)+"px";

    snow.style.animationDuration=(6+Math.random()*6)+"s";

    snow.style.animationDelay=(-Math.random()*12)+"s";

    document.body.appendChild(snow);

}

</script>

</body>
</html>
