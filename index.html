<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Site</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
}

h1{
    color:#ffffff;
    font-size:78px;
    font-weight:bold;
    z-index:100;
    user-select:none;
    cursor:pointer;
    animation:pulse 1.5s infinite;
}

.snow{
    position:fixed;
    top:-60px;
    color:#ffffff;
    font-size:22px;
    pointer-events:none;
    z-index:1;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes pulse{

0%{opacity:.65;}

50%{opacity:1;}

100%{opacity:.65;}

}

@keyframes fall{

0%{
transform:translateY(-80px) rotate(0deg);
}

100%{
transform:translateY(calc(100vh + 100px)) rotate(360deg);
}

}

</style>

</head>

<body>

<h1>click to enter...</h1>

<script>

for(let i=0;i<35;i++){

let snow=document.createElement("div");

snow.className="snow";

snow.innerHTML="❄";

snow.style.left=Math.random()*100+"vw";

snow.style.animationDuration=(6+Math.random()*6)+"s";

snow.style.animationDelay=(-Math.random()*12)+"s";

snow.style.fontSize=(14+Math.random()*20)+"px";

document.body.appendChild(snow);

}

</script>

</body>
</html>
